<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f9fae9">
<link rel="icon" href="data:,">
<meta property="og:title" content="跃点">
<meta property="og:description" content="按住蓄力，松手跳向下一座平台。">
<title>跃点</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #f9fae9; }
  body { color: #344d43; font: 15px system-ui, "Microsoft YaHei", sans-serif; user-select: none; overscroll-behavior: none; }
  [hidden] { display: none !important; }
  #game { position: relative; width: 100%; height: 100%; overflow: hidden; touch-action: none; }
  canvas { display: block; width: 100%; height: 100%; }
  .hud { position: absolute; inset: 0; pointer-events: none; }
  .top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; padding: max(20px, env(safe-area-inset-top)) clamp(16px, 4vw, 48px) 0; }
  h1 { margin: 0; font-size: clamp(21px, 3vw, 34px); font-weight: 540; letter-spacing: .08em; }
  .score { text-align: center; }
  #score { display: block; font: 500 clamp(40px, 6vw, 66px)/1 system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  .caption, .best { color: #61776a; font-size: clamp(12px, 1.5vw, 15px); }
  .best { justify-self: end; padding-top: 7px; }
  #message { position: absolute; top: clamp(88px, 18%, 146px); left: 12px; right: 12px; margin: 0; text-align: center; color: #526e60; font-size: clamp(14px, 2vw, 20px); }
  #message[data-tone="warn"] { color: #a05440; }
  .controls { position: absolute; left: 50%; bottom: max(28px, env(safe-area-inset-bottom)); width: min(340px, 76%); transform: translateX(-50%); text-align: center; }
  .controls p { margin: 0; }
  .instruction { font-size: clamp(16px, 2.4vw, 23px); }
  .meter { height: 9px; margin: 12px auto 8px; border-radius: 8px; background: #d6e1d1; overflow: hidden; }
  #fill { width: 100%; height: 100%; background: #dfae3d; transform: scaleX(0); transform-origin: left; }
  button { pointer-events: auto; touch-action: manipulation; border: 0; min-height: 44px; border-radius: 25px; padding: 8px 20px; font: inherit; cursor: pointer; }
  #retry { position: absolute; right: max(16px, env(safe-area-inset-right)); bottom: max(24px, env(safe-area-inset-bottom)); background: #355d4c; color: #fff; }
  .result { position: absolute; top: 50%; left: 50%; width: min(360px, calc(100% - 40px)); transform: translate(-50%, -50%); padding: 24px; border-radius: 24px; background: #fbfcf1; box-shadow: 0 12px 36px #344d4324; text-align: center; pointer-events: auto; }
  .result h2 { margin: 0 0 8px; font-size: 24px; }
  .result p { margin: 8px 0; }
  #again { margin-top: 8px; background: #355d4c; color: #fff; width: 100%; }
  .actions { position: absolute; right: clamp(16px, 4vw, 48px); top: max(54px, calc(env(safe-area-inset-top) + 34px)); display: grid; justify-items: end; gap: 5px; }
  .actions button, .secondary { background: #e6ece0; color: #344d43; font-size: 13px; padding: 6px 12px; }
  .result { max-height: 90%; overflow: auto; touch-action: pan-y; }
  #submit-score, #result-leaders { margin-top: 8px; }
  dialog { width: min(420px, calc(100% - 28px)); max-height: 88%; padding: 22px; border: none; border-radius: 22px; background: #fbfcf1; color: #344d43; }
  dialog::backdrop { background: #253b3290; }
  dialog header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  dialog h2 { margin: 0; font-size: 22px; }
  #ranking-form { margin: 10px 0 14px; }
  #ranking-form label { display: block; margin-bottom: 5px; }
  #ranking-form input { display: block; width: 100%; min-height: 44px; border: 1px solid #819688; border-radius: 12px; padding: 8px 12px; font: inherit; font-size: 16px; }
  #publish-score { margin-top: 8px; background: #355d4c; color: white; }
  #ranking-body { padding-left: 30px; }
  #ranking-body li { padding: 7px 0; border-bottom: 1px solid #e0e9dc; }
  #ranking-body li div { display: flex; gap: 12px; justify-content: space-between; overflow-wrap: anywhere; }
  #ranking-status { min-height: 1em; font-size: 13px; }
  :focus-visible { outline: 2px solid #84671b; outline-offset: 3px; }
  @media (max-width: 680px) and (orientation: portrait) {
    #retry { bottom: max(106px, calc(env(safe-area-inset-bottom) + 84px)); }
  }
  @media (max-height: 450px) and (orientation: landscape) {
    .top { padding-top: 10px; }
    #message { top: 72px; }
    .controls { bottom: 10px; }
    .meter { margin-top: 5px; margin-bottom: 4px; }
    #retry { bottom: 9px; }
  }
</style>
</head>
<body>
<main id="game" aria-label="跃点">
  <canvas id="stage"></canvas>
  <div class="hud">
    <header class="top">
      <h1>跃点</h1>
      <div class="score"><output id="score">00</output><span class="caption">本局得分</span></div>
      <div class="best">最高 <output id="best">00</output></div>
    </header>
    <div class="actions">
      <button type="button" id="leaders">排行榜</button>
      <button type="button" id="sound" aria-pressed="true">音效：开</button>
    </div>
    <p id="message" role="status">正在准备游戏…</p>
    <div class="controls">
      <p class="instruction">按住蓄力 · 松手起跳</p>
      <div class="meter" aria-hidden="true"><div id="fill"></div></div>
      <p class="caption" id="controls-text">空格 / 鼠标左键 / 触屏长按</p>
    </div>
    <button id="retry" type="button" hidden>再跳一次</button>
    <section class="result" id="result" hidden aria-labelledby="result-title">
      <h2 id="result-title">再试一跳？</h2>
      <p id="reason"></p>
      <p id="total" class="caption"></p>
      <button id="submit-score" class="secondary" type="button" hidden>提交本局成绩</button>
      <button id="result-leaders" class="secondary" type="button">查看排行榜</button>
      <button id="again" type="button">重新开始</button>
    </section>
  </div>
</main>
<dialog id="ranking" aria-labelledby="ranking-title">
  <header><h2 id="ranking-title">好友挑战排行榜</h2><button id="close-rank" class="secondary" type="button">关闭</button></header>
  <form id="ranking-form" hidden>
    <label for="nickname">昵称</label>
    <input id="nickname" required maxlength="16" placeholder="最多 16 个字" autocomplete="nickname">
    <p class="caption">提交后，任何打开链接的人都可以看到你的昵称和最高分。</p>
    <button id="publish-score" type="submit">公开成绩</button>
  </form>
  <p id="ranking-status" role="status"></p>
  <ol id="ranking-body"></ol>
  <button id="share" class="secondary" type="button">分享游戏链接</button>
</dialog>
<noscript>请在浏览器中启用 JavaScript 后打开游戏。</noscript>

  if (muted || audioContext?.state !== 'running') return;
  const start = audioContext.currentTime;
  const pitches = [285, 185, 410, 310, 540, 215];
  const pitch = pitches[kind];
  tone(start, pitch, pitch * (kind === 5 ? 1.7 : .55), kind === 4 ? .065 : .13, .11,
    kind === 2 || kind === 4 ? 'triangle' : 'sine');
  if (perfect) {
    tone(start + .045, 880, 880, .12, .065);
    tone(start + .095, 1320, 1320, .16, .045);
  }
}

soundButton.addEventListener('click', () => {
  muted = !muted;
  syncSoundButton();
  if (!muted) prepareSound();
  try { localStorage.setItem('yuedian-muted', muted ? '1' : '0'); } catch {}
  soundButton.blur();
});
syncSoundButton();

async function requestRanking(body) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 8000);
  try {
    const options = { signal: controller.signal };
    if (body) Object.assign(options, { method: 'POST', headers: {
      'Content-Type': 'text/plain;charset=UTF-8'
    }, body: JSON.stringify(body) });
    const response = await fetch(rankingApi, options);
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || '排行榜暂时无法连接');
    return data;
  } finally {
    clearTimeout(timer);
  }
}

async function loadRanking(notice = '') {
  const request = ++rankingRequest;
  rankingBody.replaceChildren();
  rankingStatus.textContent = '正在加载排行榜…';
  try {
    const { entries, total } = await requestRanking();
    if (request !== rankingRequest) return;
    entries.forEach(({ nickname, score }) => {
      const item = document.createElement('li');
      const row = document.createElement('div');
      const name = document.createElement('span');
      const points = document.createElement('strong');
      name.textContent = nickname;
      points.textContent = score + ' 分';
      row.append(name, points);
      item.append(row);
      rankingBody.append(item);
    });
    const summary = total ? '共 ' + total + ' 位玩家' + (total > entries.length ? '，显示前 100 名' : '')
      : '还没有成绩，来拿下第一名。';
    rankingStatus.textContent = notice ? notice + ' · ' + summary : summary;
  } catch {
    if (request === rankingRequest) rankingStatus.textContent = notice
      ? notice + ' · 暂时无法读取榜单' : '排行榜暂时连不上，请稍后再试。';
  }
}

function openRanking(submit) {
  cancel();
  submittedScore = submit ? score : 0;
  rankingForm.hidden = !submittedScore || location.protocol === 'file:';
  if (!ranking.open) ranking.showModal();
  if (location.protocol === 'file:') {
    rankingStatus.textContent = '请打开在线版查看和提交成绩。';
    return;
  }
  loadRanking();
}

document.getElementById('leaders').addEventListener('click', () => openRanking(false));
document.getElementById('result-leaders').addEventListener('click', () => openRanking(false));
submitScore.addEventListener('click', () => openRanking(true));
document.getElementById('close-rank').addEventListener('click', () => ranking.close());
ranking.addEventListener('close', () => document.activeElement?.blur());
rankingForm.addEventListener('submit', async event => {
  event.preventDefault();
  if (publishScore.disabled) return;
  const nickname = nicknameInput.value.normalize('NFKC').trim();
  if (!/^[\p{L}\p{M}\p{N}_· -]{1,16}$/u.test(nickname)) {
    rankingStatus.textContent = '请输入 1–16 位昵称，可用文字、数字、空格和连接符。';
    nicknameInput.focus();
    return;
  }
  ++rankingRequest;
  publishScore.disabled = true;
  rankingStatus.textContent = '正在提交…';
  try {
    if (!deviceToken) deviceToken = Array.from(crypto.getRandomValues(new Uint8Array(24)),
      value => value.toString(16).padStart(2, '0')).join('');
    try {
      localStorage.setItem('yuedian-player-token', deviceToken);
      localStorage.setItem('yuedian-nickname', nickname);
    } catch {}
    const { best } = await requestRanking({ token: deviceToken, nickname, score: submittedScore });
    rankingForm.hidden = true;
    submitScore.hidden = true;
    await loadRanking('已提交，榜上最高 ' + best + ' 分');
  } catch {
    rankingStatus.textContent = '提交失败，请稍后重试。';
  } finally {
    publishScore.disabled = false;
  }
});

document.getElementById('share').addEventListener('click', async () => {
  try {
    if (navigator.share) {
      await navigator.share({ title: '跃点 · 好友挑战', url: shareUrl });
    } else {
      await navigator.clipboard.writeText(shareUrl);
      rankingStatus.textContent = '游戏链接已复制。';
    }
  } catch (error) {
    if (error.name !== 'AbortError') rankingStatus.textContent = '请复制浏览器地址栏里的游戏链接。';
  }
});

function resize() {
  const rect = stage.getBoundingClientRect();
  width = rect.width;
  height = rect.height;
  worldScale = Math.min(height / 8.8, width / (width < height ? 7.25 : 11.0));
  deviceScale = Math.min(2, devicePixelRatio || 1);
  stage.width = Math.round(width * deviceScale);
  stage.height = Math.round(height * deviceScale);
  ctx.setTransform(deviceScale, 0, 0, deviceScale, 0, 0);
}
addEventListener('resize', resize);

function makePlatform(x, z, radius, kind) {
  const contour = Array.from({ length: 64 }, (_, i) => {
    const angle = TAU * i / 64;
    const u = Math.cos(angle);
    const v = Math.sin(angle);
    let size = radius;
    if (kind === 0 || kind === 2) {
      const power = kind === 0 ? 3.6 : 5;
      size /= Math.pow(Math.pow(Math.abs(u), power) + Math.pow(Math.abs(v), power), 1 / power);
    } else if (kind === 4) {
      size *= .97 + .03 * Math.cos(angle * 12);
    } else if (kind === 5) {
      size *= Math.cos(Math.PI / 8) / Math.cos(angle % (Math.PI / 4) - Math.PI / 8);
    }
    return [u * size, v * size];
  });
  return { x, z, radius, kind, contour };
}

function overPlatform(point, platform, inset = 0) {
  const x = point.x - platform.x;
  const z = point.z - platform.z;
  let inside = false;
  const vertices = platform.contour;
  for (let i = 0; i < vertices.length; i++) {
    const [ax, az] = vertices[i];
    const [bx, bz] = vertices[(i + 1) % vertices.length];
    if ((az > z) !== (bz > z) && x < ax + (bx - ax) * (z - az) / (bz - az)) {
      inside = !inside;
    }
    if (inset) {
      const dx = bx - ax;
      const dz = bz - az;
      const nearest = clamp(((x - ax) * dx + (z - az) * dz) / (dx * dx + dz * dz));
      const distance = Math.hypot(x - ax - nearest * dx, z - az - nearest * dz);
      if (distance < inset) return false;
    }
  }
  return inside;
}

function setMessage(text, warn = false) {
  message.textContent = text;
  message.dataset.tone = warn ? 'warn' : '';
}

function restart() {
  phase = 'ready';
  held = null;
  movement = null;
  count = score = streak = 0;
  routeState = 20261127;
  celebration = null;
  player = { x: 0, z: 0, y: PLATFORM_Y };
  platforms = [makePlatform(0, 0, 1.04, 0), makePlatform(3.3, 0, .94, 1)];
  focus = { x: 3.3 * .42, y: .5, z: 0 };
  scoreText.value = format(score);
  bestText.value = format(best);
  result.hidden = retry.hidden = true;
  submitScore.hidden = true;
  setMessage('前 3 跳蓄力时会显示落点');
}

function endpoint(charge) {
  const target = platforms[platforms.length - 1];
  const dx = target.x - player.x;
  const dz = target.z - player.z;
  const distance = 1.2 + 4.8 * clamp(charge);
  const factor = distance / Math.hypot(dx, dz);
  return { x: player.x + dx * factor, z: player.z + dz * factor, y: PLATFORM_Y };
}

function press(source, time) {
  if (phase !== 'ready' && phase !== 'bounce') return;
  prepareSound();
  held = source;
  startTime = time;
  phase = 'charging';
}

function release(source, time) {
  if (phase !== 'charging' || held !== source) return;
  movement = {
    from: { ...player },
    to: endpoint((time - startTime) / (FULL_CHARGE * 1000)),
  };
  held = null;
  phase = 'air';
  startTime = time;
  setMessage('');
}

function cancel() {
  if (phase === 'charging') {
    phase = 'ready';
    held = null;
  }
}

stage.addEventListener('pointerdown', event => {
  if (!event.isPrimary || event.button !== 0) return;
  event.preventDefault();
  stage.setPointerCapture(event.pointerId);
  press(event.pointerId, performance.now());
});
stage.addEventListener('pointerup', event => release(event.pointerId, performance.now()));
stage.addEventListener('pointercancel', cancel);
stage.addEventListener('lostpointercapture', event => {
  if (held === event.pointerId) cancel();
});
stage.addEventListener('contextmenu', event => event.preventDefault());
addEventListener('keydown', event => {
  if (ranking.open) return;
  if (event.code === 'Space' && document.activeElement?.tagName !== 'BUTTON') {
    event.preventDefault();
    if (!event.repeat) press('space', performance.now());
  } else if (event.code === 'KeyR' && !event.repeat) {
    restart();
  }
});
addEventListener('keyup', event => {
  if (event.code === 'Space' && held === 'space') {
    event.preventDefault();
    release('space', performance.now());
  }
});
addEventListener('blur', cancel);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) cancel();
});
for (const button of [retry, again]) {
  button.addEventListener('click', () => {
    restart();
    button.blur();
  });
}

function land(now) {
  const current = platforms[platforms.length - 2];
  const target = platforms[platforms.length - 1];
  if (overPlatform(player, target, .1)) {
    const perfect = Math.hypot(player.x - target.x, player.z - target.z) <= .22;
    streak = perfect ? streak + 1 : 0;
    const points = 1 + Math.min(streak, 4);
    score += points;
    count++;
    if (score > best) {
      best = score;
      try { localStorage.setItem(storageKey, String(best)); } catch {}
    }
    scoreText.value = format(score);
    bestText.value = format(best);
    setMessage((perfect ? '正中圆心！ +' : '稳稳落地 +') + points);
    playLanding(target.kind, perfect);
    if (streak === 3) {
      celebration = { platform: target, time: now, x: player.x, z: player.z };
      setMessage('三连击！ +' + points);
    }
    const gap = 2.65 + nextRouteValue() * 2.1;
    const right = nextRouteValue() < .5;
    platforms.push(makePlatform(target.x + (right ? gap : 0), target.z - (right ? 0 : gap),
      Math.max(.72, .96 - count * .012), (count + 1) % 6));
    if (platforms.length > 7) platforms.shift();
    phase = 'bounce';
  } else if (overPlatform(player, current, .1)) {
    playLanding(current.kind, false);
    setMessage('差一点，再蓄久一点');
    phase = 'bounce';
  } else {
    const short = Math.hypot(player.x - movement.from.x, player.z - movement.from.z) <
      Math.hypot(target.x - movement.from.x, target.z - movement.from.z);
    movement.reason = short ? '短了一点，下次多按一会儿' : '跳过头了，下次早点松手';
    setMessage(movement.reason, true);
    phase = 'fall';
  }
  startTime = now;
}

function update(now, dt) {
  const age = (now - startTime) / 1000;
  let charge = 0;
  if (phase === 'charging') {
    charge = clamp(age / FULL_CHARGE);
  } else if (phase === 'air') {
    const t = clamp(age / FLIGHT);
    const { from, to } = movement;
    player = {
      x: from.x + (to.x - from.x) * t, z: from.z + (to.z - from.z) * t,
      y: PLATFORM_Y + 4 * HEIGHT * t * (1 - t),
    };
    if (t === 1) land(now);
  } else if (phase === 'bounce' && age >= .32) {
    phase = 'ready';
  } else if (phase === 'fall') {
    player.y = PLATFORM_Y - 8.5 * age * age;
    if (player.y <= -.09) {
      player.y = -.09;
      phase = 'melt';
      startTime = now;
      movement.runners = makeRunners();
    }
  } else if (phase === 'melt') {
    retry.hidden = age < 1.05;
    if (age >= 2.9) {
      phase = 'over';
      retry.hidden = true;
      result.hidden = false;
      submitScore.hidden = score < 1 || location.protocol === 'file:';
      document.getElementById('reason').textContent = movement.reason;
      document.getElementById('total').textContent = '本局 ' + score + ' 分 · 最高 ' + best + ' 分';
    }
  }

  const a = platforms[platforms.length - 2];
  const b = platforms[platforms.length - 1];
  const death = phase === 'melt' || phase === 'over';
  const weight = 1 - Math.exp(-4 * dt);
  focus.x += ((death ? player.x : a.x + (b.x - a.x) * .42) - focus.x) * weight;
  focus.z += ((death ? player.z : a.z + (b.z - a.z) * .42) - focus.z) * weight;
  fill.style.transform = 'scaleX(' + charge + ')';
  controlsText.textContent = phase === 'charging' ? '蓄力 ' + Math.round(charge * 100) + '%' :
    motion.matches ? '长按屏幕' : '空格 / 鼠标左键';
  return charge;
}

function keepRunnerOnGround(point) {
  for (const platform of platforms) {
    const dx = point.x - platform.x;
    const dz = point.z - platform.z;
    const distance = Math.hypot(dx, dz);
    if (distance === 0) {
      point.x += platform.radius;
      return keepRunnerOnGround(point);
    }
    const angle = (Math.atan2(dz, dx) + TAU) % TAU;
    const segment = angle / TAU * platform.contour.length;
    const index = Math.floor(segment);
    const a = platform.contour[index];
    const b = platform.contour[(index + 1) % platform.contour.length];
    const fraction = segment - index;
    const edge = Math.hypot(a[0] + (b[0] - a[0]) * fraction, a[1] + (b[1] - a[1]) * fraction);
    const clearance = edge * PLATFORM_BODY_SCALE[platform.kind] + .16;
    if (distance < clearance) {
      point.x = platform.x + dx * clearance / distance;
      point.z = platform.z + dz * clearance / distance;
    }
  }
  return point;
}

function makeRunners() {
  return Array.from({ length: 5 }, (_, i) => {
    const angle = .35 + TAU * i / 5;
    const direction = { x: Math.sin(angle), z: Math.cos(angle) };
    const path = [keepRunnerOnGround({ x: player.x + direction.x * .13, z: player.z + direction.z * .13 })];
    const speed = 1.5 + i % 3 * .18;
    for (let step = 1; step <= 135; step++) {
      const previous = path[step - 1];
      const stride = speed / 60 * smooth(step / 15);
      path.push(keepRunnerOnGround({
        x: previous.x + direction.x * stride,
        z: previous.z + direction.z * stride,
      }));
    }
    return { path, sprite: direction.z < 0 ? 7 : 6 };
  });
}

function groundActors(t) {
  const puddle = .95 * (1 - smooth((t - 1.03) / .82)) * smooth(t / .7);
  const actors = [];
  if (puddle > .01) ellipse(player.x, -.09, player.z, puddle, '#eac454');
  if (t < .85) {
    const melt = smooth(t / .85);
    actors.push({ ...player, paint: () => {
      drawSprite(6, player.x, player.y, player.z, 1, Math.max(.025, 1 - melt), 0, 1 + melt * .9);
    } });
  }
  movement.runners.forEach(({ path, sprite }, i) => {
    const time = t - .65 - i * .035;
    if (time <= 0) return;
    const size = .32 * smooth(time / .23) * (1 - smooth((t - 2.55) / .35));
    if (size <= .001) return;
    const frame = Math.min(time * 60, path.length - 1);
    const from = path[Math.floor(frame)];
    const to = path[Math.ceil(frame)];
    const fraction = frame % 1;
    const x = from.x + (to.x - from.x) * fraction;
    const z = from.z + (to.z - from.z) * fraction;
    ellipse(x, -.09, z, size * .4, '#49412244');
    actors.push({ x, z, paint: () => {
      drawSprite(sprite, x, -.09 + Math.abs(Math.sin(time * 21)) * .065, z, size, 1, Math.cos(time * 20) * .19);
    } });
  });
  return actors;
}

function project(x, y, z) {
  const dx = x - focus.x;
  const dz = z - focus.z;
  return [
    width / 2 + (.855 * dx - .519 * dz) * worldScale,
    height / 2 + (.298 * dx + .491 * dz - .818 * (y - focus.y)) * worldScale,
  ];
}

function drawSprite(index, x, y, z, size = 1, yScale = 1, turn = 0, xScale = 1) {
  const sprite = sprites[index];
  if (!sprite.image.complete || !sprite.image.naturalWidth) return;
  const [sx, sy] = project(x, y, z);
  const unit = worldScale * size / ART_SCALE;
  ctx.save();
  ctx.translate(sx, sy);
  ctx.rotate(turn);
  ctx.scale(xScale, yScale);
  ctx.drawImage(sprite.image, sprite.left * unit, sprite.top * unit, sprite.width * unit, sprite.height * unit);
  ctx.restore();
}

function ellipse(x, y, z, radius, color, offset = false, stroke = false) {
  const [sx, sy] = project(x + (offset ? .22 : 0), y, z + (offset ? .077 : 0));
  ctx.beginPath();
  ctx.ellipse(sx, sy, radius * worldScale, radius * worldScale * .58, 0, 0, TAU);
  if (stroke) {
    ctx.strokeStyle = color;
    ctx.lineWidth = Math.max(1, worldScale * .022);
    ctx.stroke();
  } else {
    ctx.fillStyle = color;
    ctx.fill();
  }
}

function drawPlayer(now, charge) {
  const t = Math.max(0, (now - startTime) / 1000);
  if (phase === 'air') {
    const tAir = clamp(t / FLIGHT);
    const turn = TAU * tAir;
    const [sx, sy] = project(player.x, player.y + .52, player.z);
    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(turn);
    const sprite = sprites[tAir >= .25 && tAir < .75 ? 7 : 6];
    if (sprite.image.naturalWidth) {
      const unit = worldScale / ART_SCALE;
      ctx.drawImage(sprite.image, sprite.left * unit, sprite.top * unit + .425 * worldScale,
        sprite.width * unit, sprite.height * unit);
    }
    ctx.restore();
    return;
  }
  const squash = phase === 'bounce' ? .28 * (1 - smooth(t / .32)) : .32 * charge;
  const wink = celebration && now - celebration.time < 240;
  drawSprite(wink ? 8 : 6, player.x, player.y, player.z, 1, 1 - squash, phase === 'fall' ? t * 3 : 0, 1 + squash * .7);
}

function draw(now, charge) {
  ctx.fillStyle = '#f9fae9';
  ctx.fillRect(0, 0, width, height);
  const next = platforms[platforms.length - 1];
  const preview = phase === 'charging' && count < 3 ? endpoint(charge) : null;
  const previewPlatform = preview && platforms.find(platform => overPlatform(preview, platform));
  const shadowPlatform = platforms.find(platform => overPlatform(player, platform));
  for (const platform of platforms) {
    ellipse(platform.x, -.09, platform.z, platform.radius * 1.06, '#47463445', true);
  }
  if (preview && !previewPlatform) ellipse(preview.x, 0, preview.z, .11, '#a97147');
  if (!shadowPlatform && !['melt', 'over'].includes(phase)) {
    ellipse(player.x, -.09, player.z, .4, '#49412236');
  }
  const objects = platforms.map(platform => ({ ...platform, platform }));
  if (phase === 'melt') {
    objects.push(...groundActors((now - startTime) / 1000));
  } else if (phase === 'fall') {
    objects.push({ ...player, paint: () => drawPlayer(now, charge) });
  }
  objects.sort((a, b) => .519 * (a.x - b.x) + .855 * (a.z - b.z));
  for (const object of objects) {
    const platform = object.platform;
    if (!platform) {
      object.paint();
      continue;
    }
    drawSprite(platform.kind, platform.x, 0, platform.z, platform.radius, 1 / platform.radius);
    if (celebration?.platform === platform) {
      const progress = (now - celebration.time) / 700;
      if (progress < 1) {
        ctx.save();
        ctx.globalAlpha = (1 - progress) * .94;
        ellipse(celebration.x, PLATFORM_Y + .016, celebration.z,
          .25 + .66 * smooth(progress), '#fff4a7', false, true);
        ctx.restore();
      }
    }
    if (platform === next && !['melt', 'over'].includes(phase)) {
      ellipse(next.x, PLATFORM_Y + .01, next.z, .24, '#fff9e5', false, true);
    }
    if (platform === previewPlatform) {
      ellipse(preview.x, PLATFORM_Y + .02, preview.z, .11, overPlatform(preview, next, .1) ? '#3a7867' : '#9a623f');
    }
    if (platform === shadowPlatform && !['melt', 'over'].includes(phase)) {
      ellipse(player.x, PLATFORM_Y + .012, player.z, .39, '#49412245', true);
    }
  }
  if (phase === 'ready' || phase === 'charging' || phase === 'bounce' || phase === 'air') {
    drawPlayer(now, charge);
  }
}

resize();
restart();
let lastFrame = performance.now();
function frame(now) {
  draw(now, update(now, Math.min(.1, (now - lastFrame) / 1000)));
  lastFrame = now;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
